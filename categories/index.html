<script>
    let localStorageValue = localStorage.getItem("pref-theme");
    let mediaQuery = window.matchMedia('(prefers-color-scheme: dark)').matches;

    switch (localStorageValue) {
        case "dark":
            document.documentElement.classList.add('dark');
            document.body.classList.add('dark');
            break;
        case "light":
            document.body.classList.remove('dark');
            document.documentElement.classList.remove('dark');
            break;
        default:
            if (mediaQuery) {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
            }
            break;
    }
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const filter = document.getElementById("categoryFilter");
    const posts = document.querySelectorAll(".post-card");

    
    function getURLParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    
    function updateURLWithFilter(category) {
        const url = new URL(window.location);
        if (category === 'all') {
            url.searchParams.delete('category');
        } else {
            url.searchParams.set('category', category);
        }
        window.history.replaceState({}, '', url);
    }

    
    function applyFilter(selectedCategory) {
        let visibleCount = 0;
        posts.forEach(post => {
            const categories = (post.dataset.categories || "").toLowerCase().split(" ");
            if (selectedCategory === "all" || categories.includes(selectedCategory)) {
                post.style.display = "";
                visibleCount++;
            } else {
                post.style.display = "none";
            }
        });
        
        
        if (visibleCount === 0 && selectedCategory !== 'all') {
            const noResults = document.getElementById('noResults');
            if (!noResults) {
                const noResultsMsg = document.createElement('div');
                noResultsMsg.id = 'noResults';
                noResultsMsg.className = 'col-12 text-center mt-4';
                noResultsMsg.innerHTML = `<p class="text-muted">Không có bài viết nào trong danh mục này.</p>`;
                document.getElementById('postsContainer').appendChild(noResultsMsg);
            }
        } else {
            const noResults = document.getElementById('noResults');
            if (noResults) noResults.remove();
        }
    }

    
    const savedCategory = getURLParam('category');
    if (savedCategory) {
        filter.value = savedCategory;
        applyFilter(savedCategory.toLowerCase());
    }

    
    filter.addEventListener("change", function() {
        const selected = this.value.toLowerCase();
        applyFilter(selected);
        updateURLWithFilter(selected);
        
        
        updatePaginationLinks(selected);
        
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    
    function updatePaginationLinks(category) {
        const paginationLinks = document.querySelectorAll('.pagination a');
        paginationLinks.forEach(link => {
            const href = new URL(link.href, window.location.origin);
            if (category === 'all') {
                href.searchParams.delete('category');
            } else {
                href.searchParams.set('category', category);
            }
            link.href = href.toString();
        });
    }

    
    const currentCategory = filter.value.toLowerCase();
    if (currentCategory !== 'all') {
        updatePaginationLinks(currentCategory);
    }
});
</script>
